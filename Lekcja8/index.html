<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit i button</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <table>
            <tr>
                <td><input type="button" id="stozek" value="Stożek"></td>
                <td><span class="stozek">
                    <form id="form_stozek">
                        <label for="r">Promień</label><br>
                        <input type="number" id="r"><br>
                        <label for="h">Wysokość</label><br>
                        <input type="number" id="h"><br>
                        <label for="l">Obwód</label><br>
                        <input type="number" id="l"><br>
                        <input type="submit" value="Oblicz">    
                        <p id="ob_s">Objętość: </p>
                        <p id="pb_s">Pole boczne: </p>
                    </form>
                </span></td>
            </tr>
            <tr>
                <td><input type="button" id="kula" value="kula"></td>
                <td><span class="kula">
                    <form id="form_kula">
                        <label for="rk">Promień</label><br>
                        <input type="number" id="rk"><br>
                        <input type="submit" value="Oblicz">
                        <p id="ob_k">Objętość: </p>
                        <p id="pb_k">Pole: </p>
                    </form>
                </span></td>
            </tr>
            <tr>
                <td><input type="button" id="ostro" value="ostrołup"></td>
                <td><span class="ostro">
                    <form id="form_ostro">
                        <label for="wys">Wysokość</label><br>
                        <input type="number" id="wys"><br>
                        <label for="bok1">Długość boku pierwszego</label>
                        <input type="number" id="bok1"><br>
                        <label for="bok2">Długość boku drugiego</label>
                        <input type="number" id="bok2"><br>
                        <input type="submit" value="Oblicz">
                        <p id="ob_o">Objętość: </p>
                        <p id="prawi"></p>
                    </form>
                </span></td>
            </tr>    
        </table>
    </main>
</body>
<script src="script.js"></script>

</html>
